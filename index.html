<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>לידה בנחת</title><meta name="theme-color" content="#f7f0e6"><style>html, body, #root { margin: 0; min-height: 100%; }
body { background: var(--ds-page); }
.birth-app { direction: rtl; text-align: right; }

.menu { display: grid; gap: 12px; margin: 20px 0; }

.error { color: var(--ds-red); font-weight: 600; }
@media (min-width: 768px) { .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.reading-text p { margin: 0 0 1em; }
.affirmations { font-size: 20px; line-height: 1.9; }
.affirmations p { border-bottom: 1px solid var(--ds-hairline); margin: 0; padding: 20px 0; }
.sources { margin-top: 24px; border-top: 1px solid var(--ds-hairline); }
.sources summary { cursor: pointer; padding: 18px 0; min-height: 44px; box-sizing: border-box; }
.birth-app .file-card { overflow-wrap: anywhere; }

</style></head><body><main class="birth-app reader" id="app"></main><script>const content={"cabin":"ארוחת ערב בבקתה\nהניחי לאוויר לצאת מגופך ואז בעדינות שאפי ונשפי.\nלאט ובעדינות בזמן שלך.\nכשאת עוצמת את עינייך, יותר קל לך לשים לב לקולות\nשסביבך. הקשיבי לנשימה שלך במשך דקה או שתיים,\nבעודה נעשית ארוכה יותר... איטית יותר... עמוקה\nיותר... ‏ כעת, כשהנשימה שלך מתפשטת בתוכך\nומביאה עמה שלווה ורוגע לכל הגוף, שימי לב לקולות\nהפטפוט בתוך ראשך. הקשיבי בשקט ושימי לב\nשהפטפוט מתרכך בהדרגה ונעלם לחלוטין. כעת,\nהתמקדי בקולות שבחדר, ובעוד הם הולכים ונחלשים,\nהקשיבי לדממה. כעת הניחי לתשומת לבך להקיף את\nכל הבניין, הקשיבי לשקט, לרחוב, לעיר, וכעת חשבי\nעל כל הארץ. אפשרי לשקט לשטוף את כל כולך, רחב\nיותר ויותר, עד שהוא מקיף את העולם, עוד ועוד, הלאה\nמשם, דממה עמוקה יותר...\nכעת דמייני לעצמך שאת מגיעה לסופו של טיול ארוך\nבטבע. היה יום נהדר, אך הלכת מרחק רב ואת עייפה\nעכשיו. בפיקניק של שעת הצהרים אכלת רק משהו קל,\nוזה היה לפני שעות רבות, הלכת הרבה מאז, וכעת את\nמרגישה מורעבת. המחשבה על ארוחת ערב ממלאת\nאת מחשבותייך כל הזמן.\nבשעה שאת צועדת חזרה לבקתה הנחמדה והמזמינה\nשבה את מתארחת, את מבחינה בשער הגן שלה. את\nרואה את הצורה שלו ואת הגודל שלו. את רואה את\nצבעיו. כשאת ניגשת אליו ומניחה עליו את ידייך כדי\nלפתוח אותו, את מרגישה את הטקסטורה של השער,\nמחוספס או חלק, חם או קר. את פותחת את השער,\nמרגישה את משקלו ושומעת את צליל הצירים שלו.\nכשאת נכנסת דרכו את מרגישה את הטקסטורה של\nהשביל מתחת לרגלייך. את שומעת את הצלילים של\nצעדייך. זהו גן יפהפה, מלא בפרחים\nבשלל צבעים. את עוצרת להריח ורד חושני ויפהפה -\nהרגישי את מגע הקטיפה של עלי הכותרת על הלחי\nשלך. שימי לב לריח הנפלא. הקשיבי לזמזום הדבורים\n\nהמלקטות צוף מהפרחים. הרגישי את חומן הנעים של\nקרני השמש האחרונות לפני השקיעה. במרחק, ינשוף\nראשון משמיע קול.\nאת מתקדמת לעבר הבקתה ופותחת את הדלת. את\nנכנסת למסדרון קטן ואת פנייך מקדם ריחו המפתה של\nלחם שזה עתה נאפה בבקתה. שימי לב לשינויים\nהמתחוללים בפיך. את פותחת את דלת המטבח וריח\nחזק יותר של ארוחת הערב ממלא את אפך. הריח נפלא\nומעורר תיאבון וגורם לך לחוש עוד יותר רעבה, את\nמדמיינת את הארוחה הטרייה והטעימה, שזה עתה\nהוכנה וממתינה לך. את מתיישבת במקומך ליד\nהשולחן, מוכנה להתחיל לאכול, וצלחת ובה כל\nהמאכלים האהובים עלייך מוגשת לך.\n\n\nכעת פקחי את עינייך. מה קרה פה בעצם?\n\nאנשים רבים מגלים שהם מריירים. ייתכן שגם לך זה קרה\nוייתכן שלא. אם אומר לך לרייר לא תוכלי לעשות זאת על פי\nפקודה, כי זוהי תגובה בלתי רצונית. עם זאת, רעיונות שאת\nמעלה בראשך, יכולים לגרום לך לרייר, בדיוק כמו הכלבים של\nפבלוב. כך גם בלידה, שהיא תהליך בלתי רצוני, אך רעיונות\nשתעלי במחשבותייך יכולים להשפיע על התקדמותה ועל\nנוחותה.\n\nלא כולם יריירו במהלך התרגיל שלעיל. רוב האנשים כן, אך\nחלק לא כי אנו שונים זה מזה - כולנו מגיבים לדברים שונים\nולומדים בדרכים שונות. לדוגמה, חלק מהאנשים לומדים\nויזואלית, זאת אומרת שהם לומדים דברים באמצעות שימוש\nבחוש הראייה, בעוד אחרים הם יותר שמיעתיים ומעדיפים\nשיסבירו להם דברים. לכן בהיפנובירת'ינג מוצעים לכם תרגילים\nרבים ושונים. אין צורך לעשות את כולם, פשוט תבחרי את אלו\nהמועדפים עלייך. אני בטוחה שאת יודעת מהו צבע הוורד\nשהרחת בתרגיל - ייתכן שהוא היה ורוד או אדום, לבן או צהוב.\nוכשחשבת על המקום שבו ביקרת, זה היה כאילו שהיית שם\nבאמת ושכחת את המקום שבו את יושבת כעת. התפאורה של\nהבקתה הייתה אמיתית יותר מהמקום שבו את נמצאת באמת\nכעת. זהו רק תרגיל קטן, אך הוא יעיל מאוד.","downIntro":"נפתח. את מה שאני מכנה \"נשימות DOWN\" אנו מבצעים לאחר\nשצוואר הרחם נפתח במלואו והתינוק יורד למטה בתעלת הלידה\nלתוך העולם. הבה נתרגל כעת. זוהי שאיפה מהירה פנימה דרך\nהאף ונשיפה ארוכה יותר החוצה דרך האף. אין ספירה מסוימת\nבנשימה זו.\n\nבנשימה הזו נושפים החוצה דרך האף כי היא נשימה הרבה\nיותר ממוקדת, כמו עוקבת אחר התינוק בירידתו. למעשה את\nיכולה להרגיש ברצפת האגן את המיקוד כלפי מטה - לא\nדחיפה כלפי מטה, אלא מיקוד כלפי מטה. נסי זאת בעצמך כמה\nפעמים. שאיפה קצרה דרך האף ונשיפה ארוכה יותר דרך האף,\nובו-זמנית את מפנה את מלוא תשומת לבך כלפי מטה. בדיוק\nכמו נשימת ה-UP, גם לנשימת ה-DOWN ישנם דימויים נלווים\nהמתאימים לה. דימוי של כל דבר יורד, רך ופתוח יכול לסייע. את\nיכולה לנסות לדמיין אדוות מים על פני אגם, במקום שבו דג עלה\nמעל פני המים; האדוות נעות כלפי חוץ, עוד ועוד, והכול נוזלי\nורך, חלק ועדין יותר ויותר. זהו מראה מקסים.\n\nאת יכולה גם לדמיין ורד פורח או כל פרח שאת אוהבת\nולחוש תחושה כה רכה וקטיפתית על לחייך כשתשאפי את ריחו\nהמתקתק. זהו דימוי רך ופתוח ואם תחשבי על משהו רך ופתוח,\nגופך יגיב באופן רך ופתוח. מן הסתם ראית בעבר סרטון של פרח\nנפתח במהירות מואצת - אם תדמייני משהו כזה, זה יכול\nלהועיל לך מאוד.\n\nדימוי נוסף שיכול לסייע לך הוא זה של פלג מים הנשפך\nלמפל עדין וקטן. אם תוך כדי טיול בהרים את מוצאת פלג מים\nכזה את יכולה לשבת לידו ולהיות מוקסמת במשך שעות מטיפות\nהמים הנוצצות באור קרני השמש. אם לידת התינוק שלך צפויה\nלקרות בתקופת החורף אולי תעדיפי לדמיין פתיתי שלג מרקדים\nכלפי מטה בתצורות יפהפיות. כל מראה רך, נפתח או שכיוונו\n\"כלפי מטה\" יכול לסייע ולהיות אפקטיבי.\n\nאת יכולה להשתמש בדימויים שיובאו בהמשך, בזמן שאת\nנושמת את נשימות ה-DOWN, ועדיף שבן זוגך או שותף הלידה\nשלך, יקריא לך אותם.\n\nהקדישי כמה דקות כדי לתרגל את נשימות ה-DOWN עם\nהדימויים הנלווים להן. שאפי במהירות פנימה וכשתנשפי דמייני\nאת אותו פרח במלוא תפרחתו, יפהפה, רך, קטיפתי וחושני.\nשאפי וכשאת נושפת, דמייני את האדוות באגם מתפשטות כלפי\n\nחוץ, נוזליות, רכות ונפתחות. ועוד פעם, שאיפה פנימה ובעת\nהנשיפה החוצה דמייני את המפל הקטן והקסום. מראה קרני\nהשמש הנופלות על טיפות המים, למטה, ברכות ובעדינות,\nמהפנט אותך. ועתה, שאפי ודמייני את פתיתי השלג מרקדים\nבעדינות ובקלילות כלפי מטה.\n","downImagery":"\nזוהי שאיפה קצרה ומהירה מהאף ונשיפה ארוכה יותר דרך האף\nוהתמקדות כלפי מטה.\n\nדמייני ורד במלוא תפרחתו, כל כך רך, כל כך קטיפתי\nופתוח.\n\nהביטי באדוות המים באגם הנפתחות החוצה עוד ועוד.\nהכול נוזלי, חלק ופתוח.\n\nבכל נשימה ונשימה גופך משחרר את התינוק שלך\nבקלות ובעדינות כלפי מטה.\n\nדמייני מפל מים מקסים, שמימיו זורמים בעדינות כלפי\nמטה. שמש מתנוצצת על טיפות המים.\n\nבטחי בתנועה העדינה של גופך ושל התינוק שלך כלפי\nמטה.\n\nהתבונני בפתיתי שלג המרקדים בעדינות וברכות כלפי\nמטה.\n\nהתינוק שלך נע בקלות כלפי מטה.\n\nבכל נשימה הוא מתקרב אלייך\n\nהתמקדי למטה, בכיוון שלו\n\nעוד מעט תאחזי בו בין זרועותייך\n\n","downAfter":"כמו בדימויים של נשימות ה-UP, כדאי לשמור על פשטות.\nהבאתי הרבה דוגמאות לשני השלבים אך ייתכן שתרצי לחזור על\nאותו דימוי שוב ושוב, כמו מנטרה. המשפטים הללו הם רק\nהצעות אך בשעה 03:00 לפנות בוקר, כשאתם לא במיטבכם, הם\nיכולים להיות לכם שימושיים. אם בן הזוג מקריא לך, ואת\nמרגישה שדימוי אחר יהיה יעיל יותר, השתמשו בו. אבות, שימו\nלב, אתם יכולים לומר כל מה שתרצו או פשוט לומר משהו כמו:\n\"את עושה עבודה מעולה\" ו\"אני אוהב אותך\". זה נהדר. היעזרו\nבדוגמאות כקווים מנחים אשר אולי ישמשו אתכם בזמן הלידה.","relax":[{"id":"head","title":"ראש ופנים","text":"הניחי לנשימה שלך להאט ולהעמיק; הכול נוח כל כך\nושלו כל כך. בזמן שאני מדבר, עצמי את עינייך ברכות\nובקלות ותתחילי להירגע בשלווה ובביטחון. נשמי\nבנוחות, לאט ועמוק. הניחי לגופך לשקוע... בכבדות...\nהרפיה עמוקה... בנוחות מוחלטת...\nכעת הניחי לרוגע שבעפעפיים שלך להתפשט לכיוון\nמצחך, כך שגם הוא יירגע וייעשה חלק ונינוח. תיהני\nמתחושת הנוחות ומהרווחה.\nקחי לך הפסקה קלה, וכעת אפשרי לרוגע להתפשט\nבטבעיות ממצחך, לזרום לתוך עינייך ומסביב להן,\nוהלאה למטה דרך הלחיים, ללסת, לצוואר שלך -\nהכול נעשה רפוי כשהנוחות המרגיעה מתפשטת\nברכות.\nכעת, אפשרי גם לפיך להירגע, כך שהוא לגמרי רך\nונינוח. שפתייך ועינייך מחייכות ברכות.\nהרגישי את לשונך מתרככת בטבעיות מוחלטת בתוך\nפיך, וכעת פנייך וראשך רפויים לגמרי בעדינות. תיהני\nמתחושת הנוחות ומהרווחה.\nלבסוף, אפשרי לכתפייך להישמט ולשקוע בעדינות\nלמיקומן הטבעי, וכעת כל גופך רגוע, רדום ורפוי\nוהנשימה שלך רכה ואיטית.\nכעת נוחי בידיעה ודאית שהרפיה רגועה ונפלאה זו,\nנמצאת פה בשבילך כשתלדי את התינוק שלנו\nבטבעיות, בשלווה ובביטחון.","images":["76e33e90"],"audio":null},{"id":"touch","title":"ליטופים","text":"עצמי את העיניים בעדינות ובקלות כדי שתוכלי\nלהתמקד טוב יותר בקול שלי. פשוט הניחי לנשימה\nשלך להאט, להיות עמוקה... נוחה ושלווה כל כך. כעת\nהרגישי את משקל כפות רגלייך על הרצפה (או על\nהמיטה). התמקדי בכפות רגלייך והרגישי כיצד כל לחץ\nוכל מתח נשטפים באופן בלתי נשלט למטה אל מחוץ\nלגוף דרך כפות הרגליים, אל תוך הקרקע ומוחלפים\nכעת בגל של רוגע ושלווה. את חשה הקלה ונוחות\nותחושת חמימות ורווחה מתפשטת בכל הווייתך.\nנשימתך נהיית איטית יותר ועמוקה יותר, איטית\nועמוקה, נוחות ורווחה.\n(החל ללטף את כף ידה ואת הזרוע של בת זוגך, דבר\nלאט וברוגע)\nתוך כדי דיבור, אתחיל ללטף את כף ידך בעדינות\nוברכות. אפשרי לעצמך ליהנות מהתחושה הנעימה\nבכף ידך, מהמגע הרך והמרגיע. את מרגישה כאילו ידך\nעטופה בבַּטְחָה בתוך כפפת משי או קטיפה;\nאנדורפינים מתפשטים בכל גופך - רכות... ביטחון...\nכל כך חמים...כל כך בטוח...כל כך נוח.\nכעת את מבחינה שהתחושה בכף ידך מתחילה\nלהיעלם. את מרגישה את המגע שלי אך הדבר היחיד\nשאת חשה בו בידך היא תחושת חמימות ונוחות, ואולי\nגם עקצוץ קל; ידך נהיית רדומה. היא נחה רגועה,\nמשוחררת ונטולת תחושה, אני ממשיך ללטף אותה,\nוהתחושה הולכת ופוחתת עוד ועוד. את מרגישה כל כך\nרגועה כי את יודעת שידך מוגנת ובטוחה לחלוטין.\nבהדרגה היא נהיית משוחררת יותר ויותר מכל תחושה\nעד שאת לא מרגישה בה בדבר.\nכעת את יכולה להעביר את אותה התחושה בידך לכל\nמקום שתרצי בגופך. כל שעליך לעשות הוא לדמיין\nבמחשבתך את\nאותו חלק בגופך שיהיה משוחרר לחלוטין מכל תחושה\nשהיא, וכל התחושות נעלמות בעדינות, בעדינות. תיהני\nמתחושה זו, מהנוחות ומהרווחה.\n\nהיות שכעת את רגועה מאוד, תיהני מהזמן המיוחד הזה\nוהקדישי קצת זמן כדי:\n\n1. לאפשר לתחושת הרווחה וההעצמה להתפשט בכל\nגופך ולמלא אותך בביטחון בעת לידת התינוק שלך.\n\n2. להעריך את כוחה של האינטואיציה האימהית שלך,\nהמנחה ומגנה עלייך ועל התינוק שלך בזמן הגלים ובעת\nיציאתו לאוויר העולם.\n\n3. להתמלא בביטחון שגופך תוכנן ללדת בצורה יעילה\nורגועה.\n\n4. להניח לגופך להשתחרר ולהרפות, כפי שתנהגי בזמן\nהלידה הטבעית של התינוק שלך.\n\n5. לאפשר למחשבותייך ולגופך לפעול בהרמוניה\nלקראת לידה חלקה ורכה.\n\n(הפסקה. כשעבר די זמן הפסק ללטף)\n\nהיה זה זמן מיוחד מאוד - נהיית רגועה ושמחה כי את\nמבינה מהי תחושת הסיפוק המצפה לך כשתלדי את\nהתינוק שלנו. עכשיו את יודעת שאת מסוגלת לשלוט\nבגופך לפי רצונך. בעוד דקה יהיה זה הזמן לחזור לכאן\nאליי לחדר הזה ולהביא אתך את הביטחון הרגוע. את\nרגועה באופן מופלא, רעננה ומועצמת, ובטוחה שלידת\nהתינוק שלנו תהיה רגועה, בריאה ומהירה. בפעם\nהבאה שנתרגל את תירגעי באופן עמוק יותר, הביטחון\nשלך יעמיק עוד יותר, ואת תשתחררי מהר יותר מכל\nתחושה. וכעת, בקצב שלך, פקחי את עינייך ערה\nלחלוטין וערנית.","images":["cd926a3c","010e51f5"],"audio":null},{"id":"calm-touch","title":"מגע מרגיע","text":"(הנח בעדינות את ידך על בטנה של אשתך או זוגתך)\nכשכף ידי נחה על בטנך, עינייך נעצמות, והעפעפיים\nשלך נחים בקלילות ובעדינות על לחייך. את חשה\nהקלה כשהאזור סביב עינייך הולך ונרגע, והתחושה הזו\nשל נוחות ורוגע מתפשטת במצחך, סביב הרקות,\nגולשת בעדינות מטה, חולפת על פני עצמות הלחיים\nשלך, הלסתות שלך, והתחושה רכה וקלה. עתה הרגישי\nאת ההירגעות המתעצמת הכוללת את הצוואר ואת\nהכתפיים וכל גופך שוקע לתוך הירגעות עמוקה ונוחה,\nעמוקה יותר ויותר, כל כך נוחה, כל כך קלה- הרגשה\nנפלאה של רווחה.\nכעת שימי לב שהנשימה שלך האטה ונעשתה עמוקה.\nשאיפה...נשיפה, שאיפה... ונשיפה... עמוק יותר ויותר...\nכל כך נוח...כל כך רגוע.\nכעת ארים בעדינות מעט את זרועך (הרם את הזרוע\nכ־15 עד 30 ס\"מ). שימי לב כמה היא כבדה. זו הרגשה\nטובה מאוד לאפשר לי להרים אותה, ביודעך שבעוד\nרגע, כשאניח לה ליפול, הרגיעה שלך תעמיק עוד יותר\n(לשחרר את הזרוע).\nכעת שוב, שימי לב שזרועך מתרוממת בקלות כשאני\nמרים אותה (להרים את הזרוע) וכשאניח לה ליפול,\nהרגיעה שלך תהיה עמוקה מאוד מאוד (לשחרר את\nהזרוע), רוגע עמוק כל כך. עמוק יותר ויותר.\nוכעת שוב, אני מרים בעדינות את זרועך (להרים את\nהזרוע). והפעם כשאני משחרר אותה, הרגיעה שלך\nתהיה עמוקה הרבה יותר (לשחרר את הזרוע). עמוק\nיותר ויותר. את יותר רגועה. כל כך נוח. כל כך עמוק.\nבעודך נחה, ברוגע, הבחיני בצבע שחודר בהדרגתיות\nלמוחך,\nצבע הנושא עמו את כל הרוגע והשלווה שזה עתה\nיצרת, צבע שאת יכולה לחשוב עליו בכל רגע נתון,\nשנושא אותך בעוצמה לרגיעה הנהדרת והעמוקה שאת\nחווה כעת. ובכל פעם שאת חושבת על הצבע הזה את\n\nרגועה יותר ובטוחה יותר, ומרגישה שמחה ואופטימית\nלקראת לידת התינוק שלך.\nתיהני מתחושת הנוחות המיוחדת הזו ומהרגיעה\nהעמוקה שיצרת בגופך ובמוחך. עמוק יותר ויותר. דעי,\nשרגיעה עמוקה זו נמצאת עבורך כשאת, גופך ותינוקך\nחווים את החוויה המעצימה של הגלים ושל הלידה,\nבעדינות, בבטחון וברוגע.\nהניחי לתחושות אלו של רוגע אינטואיטיבי להישאר\nאתך בשעה שאני סופר מחמש עד אחת, וכשאת באופן\nהדרגתי, נעשית מודעת לסביבתך. חמש - שימי לב\nלכך שהאנרגיה מתחילה לזרום בעדינות בגופך. ארבע\n- את מתחילה להתעורר. שלוש - גופך נע בכמה\nתנועות עדינות. שתיים - שימי לב לקולות שסביבך.\nואחת - עיניים פקוחות, את שלווה, מודעת, ערה\nומרגישה בטוחה - עכשיו וגם כשתלדי את תינוקך\nבעדינות.\n","images":["b6ecc188","eae1d951"],"audio":null},{"id":"carpet","title":"מרבד הקסמים","text":"התמקמי בתנוחה נוחה ורגועה. פשוט אפשרי\nלעפעפיים שלך להיעצם ולשרירי העיניים להשתחרר\nכך שתחושי לגמרי בנוח. עכשיו נשמי עמוק ולאט\nלפחות שלוש פעמים, וכשאת נושפת, אמרי לעצמך:\n\"שחררי, הרגעי, הרפי\".\n(הבט באשתך או בזוגתך בשעה שהיא נושמת כדי\nשתדע שהיא ביצעה שלוש נשימות).\nאם את שומעת קול חיצוני, כגון קולות בחוץ, דלת\nנסגרת, רכב עובר או טלפון מצלצל - כל אלו ישמשו\nלך כאות כניסה להרפיה רגועה ועמוקה יותר.\nדמייני גל של רוגע טהור ושלווה מעל לראשך, שהולך\nלהישטף מטה לאורך גופך ולהביא עמו רוגע, הרפיה\nושלווה.\nבתחילה את חשה בגל הזורם דרך ראשך, למטה\nלמצחך, מרגיע את כל השרירים; דרך העפעפיים\nוהלחיים שנהיות חלקות יותר ורגועות. הגל שוטף את\nשפתייך, את הלסת שלך, את פיך, עד אשר אפילו\nהלשון נעשית רפויה. כעת הוא ממשיך הלאה ומביא\nעמו רוגע ורכות לצווארך ולכתפייך.\nגל הרוגע השלום והשלווה נע למטה לכיוון זרועותייך,\nדרך המרפקים והאמות שלך אל תוך כפות ידייך. שם\nהוא מלחך את קצות אצבעותייך כמו גלים רכים\nהנוגעים בעדינות בחוף הרגוע. הרפי, הרפי, הרפי.\nכעת גל הרוגע, השלום והשלווה נשטף לאט דרך החזה\nשלך ומטה דרך בטנך. הוא זורם במורד גבך ודרך האגן\nשלך וכל שריר שם מתרכך עוד יותר, נעשה רפוי ונרדם.\nהוא ממשיך מטה במורד הירכיים ונושא עמו רוגע\nורכות; מטה לברכיים, לשוקיים ולתוך כפות הרגלים.\nוכשהוא מגיע לקצות הבהונות הוא נוגע בהן\nברכות כמו גלים הנוגעים בחוף ביום נעים ומביאים\nעמם שלווה מוחלטת, רוגע והרפיה.\nהרגעי והרפי כל שריר בגופך. הרגעי והרפי.\nמחשבותייך וגופך מצויים כעת בהרמוניה מלאה, במצב\nשל רגיעה מאוד מאוד עמוקה.\n\nכעת אני רוצה שתדמייני מרבד, מרבד קסמים, בדיוק\nכמו באגדות. המרבד נמצא על מדשאה ליד עץ עצום\nויפהפה. את יודעת שמרבד זה יעניק לך חוויה נפלאה\nושמחה, ואת ניגשת אליו בשקט ומתיישבת עליו.\n\nכעת את חושבת על המקום שהיית הכי נהנית להיות\nבו. זה יכול להיות מקום שביקרת בו בעבר, מקום\nשמעולם לא ביקרת בו אך תמיד רצית להגיע אליו או\nאולי מקום חדש שקיים רק בדמיונך. מה שחשוב הוא\nשזהו המקום שבו בדיוק את רוצה להיות ותרגישי בו\nלגמרי שלווה ושקטה.\n\nאיש מלבדך אינו יודע לאן את הולכת כי את לא צריכה\nלספר לאף אחד - זוהי הבחירה שלך בלבד. מה\nשחשוב הוא שאת הולכת למקום שבו תהיי שמחה\nורגועה לחלוטין. לאחר שבחרת את היעד שלך אמרי\nלמרבד (באופן מנטלי) לקחת אותך למקום הזה. כשאת\nעושה זאת, הרגישי שהמרבד מתהדק מתחתייך,\nהקצוות מתקפלים סביבך כלפי מעלה, ואת יושבת\nישיבה בטוחה כמו בתוך כף יד קעורה.\n\nכעת המרבד מתחיל להתרומם לגובה שבו את חשה\nבטוחה ושמחה לחלוטין. הוא מתחיל להתרחק, מרחף\nבשקט ובמהירות מעל פני האדמה.\n\nאת רואה במרחק את המקום המדויק שאת כל כך רוצה\nלהגיע אליו. את מתקרבת אליו עוד ועוד עד שאת\nמרחפת מעליו. מרבד הקסמים מתחיל לרדת אט-אט\nבעדינות, מטה, מטה, מטה, ואת נוחתת ברכות רבה על\nהקרקע במקום המיוחד הזה.\n\nאת קמה ומתרחקת מהמרבד לקראת משהו שלוכד את\nמבטך. כשאת מתקרבת את מבחינה שזו עריסה מלאה\nעלי כותרת של ורדים יפהפיים המדיפים ריח מתקתק.\nאת מתקרבת עוד כשאת מבחינה בתנועה קטנה. לבך\nנאלם דום למראה התינוק הקטן ונח על עלי הכותרת\nבעריסה. את מבינה שזהו התינוק שלך, שלו חיכית\nבמשך כל החודשים האחרונים.\n\nאת מתכופפת אליו ומחייכת באושר רב למראהו. הוא\nמתבונן בך בעיניים פקוחות לרווחה ואת נמסה\nמשמחה. את מרימה את התינוק שלך ואז מתיישבת\nבעדינות לצד העריסה המלאה בעלי כותרת של ורדים.\nאת מנשקת את פניו ומערסלת אותו בין זרועותייך, שם\nהוא מתכרבל בטבעיות, בחום ובסיפוק.\n\nאני אפסיק כעת ואאפשר לך ליהנות מהזמן הזה עם\nהתינוק שלך לכמה דקות, כשאת רגועה ומוצפת אושר,\nעד ששוב תשמעי את קולי (להפסיק כאן במשך מספר\nדקות).\n\nהגיע הזמן לחזור. בעודך אוחזת בתינוק שלך בבטחה\nובאהבה בזרועותייך, את מתיישבת בחזרה על מרבד\nהקסמים. את מוכנה ללידה של התינוק שלך שכן את\nיודעת כמה אושר חוויתם יחד. בכל יום האהבה\nוהביטחון שלך גדלים כשאת מרגישה את התינוק שלך\nגדל בבטחה בתוכך ואת יודעת שאת מתכוננת בתת\nמודע בעדינות וברכות ליום החשוב שבו התינוק שלך\nייוולד.\n\nאת אומרת למרבד לקחת אותך חזרה לדשא מתחת לעץ\nשממנו הגעת. המרבד שוב מתקפל בקצותיו ונושא\nאותך בעדינות ובבטחה כמו כף יד ענקית. את מרגישה\nאת המרבד האוחז בך מכל צדי גופך כשהוא מתחיל\nלהרים אותך. פני הקרקע שוב נראים לך קטנטנים\nכשאת מתרוממת בתוכו ונוסעת בחזרה למקום שממנו\nהתחלת.\n\nאת רואה במרחק את העץ היפהפה וכשאת מתקרבת\nאליו, המרבד מאט ומתחיל לרדת ואת מרחפת לצד\nהעץ. המרבד מנמיך\n\nבאיטיות עד שאת חשה את הקרקע מתחתייך, והוא\nנפתח ונפרש עליה בעדינות. את מוצאת את עצמך שוב\nעל הדשא שמתחת לעץ, אך הפעם את מלאה בתחושות\nשל סיפוק והעצמה המצפות לך עם לידת התינוק שלך.\nכעת את מוכנה לחלוטין ליום ההוא, שכן היית עם\nהתינוק שלך בתת-מודע ואת מכינה את גופך לעשות\nאת מה שנועד לעשות, ללדת את התינוק שלך ברכות\nובטבעיות.\n\nהיה נעים מאד ואין צורך בדבר נוסף, לכן יהיה זה טבעי\nלחלוטין לעבור מחוויה זו לשינה עמוקה ושמחה\nולהתעורר בזמן המתאים, מלאת שמחה, רעננה, רגועה\nועם ציפיה מלאת בטחון ואמון שתינוקך יגיע בצורה כה\nטבעית, עדינה ושלווה. אם כך את רוצה לסיים כעת,\nהתעלמי מהספירה שלי ופשוט לכי לישון עכשיו.\n\nאם ברצונך לחזור למצב של ערנות, עקבי אחר הנחיותי\nוהאנרגיה תחזור אלייך בקלות ובטבעיות. אני אתחיל\nלספור כעת. חמש...את מתחילה להיות מודעת לספירה\n\nשלי. ארבע...את לאט מחזירה את השליטה על\nהשרירים שלך. שלש...הרגישי את האנרגיה המתחילה\nלזרום בחזרה אל תוך גופך. שתיים...שימי לב לקולות\nשסביבך ואחת...עיניך לבסוף נפקחות בעדינות, ואת\nחשה שמחה, רעננה ומאד רגועה. מלאת בטחון ואמון\nבגופך ובתהליך הטבעי של הלידה.","images":["926206bb","a5f7e791","06ee0cfc","2c6dcd83"],"audio":"magic-carpet"},{"id":"colors","title":"צבעים ורוגע","text":"זה כל כך פשוט לאפשר לנשימה שלך להיות טבעית\nלגמרי ולהבחין עד כמה את נרגעת בקלות וברכות.\nשואפת ונושפת. פנימה והחוצה. עמוק, לאט, בנוחות.\nכשאת נרגעת באופן עמוק יותר, את מבחינה\nשהעפעפיים שלך נעשים כבדים יותר, ובאופן טבעי הם\nנעצמים לאט ובקלות לאט ובקלות... עד שהם לגמרי\nנעצמים עכשיו.\nכעת דמייני לעצמך גל חמים ללא מעצורים, שכולו רוגע\nמוחלט. הוא מתחיל בקצה ראשך, ומתחיל להישטף\nבנוחות מטה דרך גופך. וכל איבר בגופך, שדרכו הוא\nזורם נעשה רדום לחלוטין. הרגישי אותו זורם מקצה\nראשך למטה. מצחך נהיה חלק לגמרי כשהוא נרגע\nלחלוטין. כעת את חשה בהתרככות ובהרפיית השרירים\nשסביב עינייך. עכשיו לחייך רכות, עכשיו שפתייך,\nואפילו הלשון נרגעת בתוך הפה. כעת שרירי הלסת\nשלך מתרככים ונעשים רפויים בקלות כשאת שוקעת\nעוד ועוד מטה... תהני מתחושת השחרור.\nהגל ממשיך לזרום דרך צווארך, מרגיע אותו ועוטף את\nכתפייך, ותחושת החמימות והקלילות נשטפת במורד\nזרועותייך, מרגיעה בדרכה כל נקודה. הגל זורם\nמכתפייך, דרך זרועותייך, דרך המרפקים שלך, דרך\nהאמות שלך, לתוך כפות ידייך, לגב כפות ידייך, כל\nהדרך מטה עד קצות האצבעות - ומאפשר לכל הגוף\nלהיות רגוע ונינוח. כעת הוא זורם ברכות דרך החזה\nשלך, דרך הבטן, מרגיע ברכות. השרירים באזור האגן\nשלך נרגעים בדיוק כפי שהם יירגעו כאשר את תלדי את\nהתינוק שלך, והם משקפים את ההרפיה הרכה של\nהלסת שלך. הגל זורם אל רגלייך, למטה לירכיים, אל\nתוך השוקיים, ועד לכפות הרגליים, שם, כמו בים, הגל\nמלחך את קצות הבהונות ומשרה רוגע מוחלט על שתי\nרגלייך.\nכעת את מבינה שאת רגועה מאוד מאוד. תחושת רווחה\nזו מאפשרת לך לשקוע עמוק יותר ויותר, מטה-מטה,\nובכל פעם את שוקעת מהר יותר, עמוק יותר, בקלות\n\nוברכות לתוך רוגע מוחלט. מטה-מטה. יותר ויותר\nעמוק.\n\nאת נעשית אפילו רגועה יותר, כשאת מדמיינת את\nעצמך שוכבת בתוך שדה יפהפה בחיק הטבע. הדשא\nרך וירוק וכל כך נוח לך, ואת מאפשרת לעצמך לשקוע\nבעדינות ובבטחה מטה-מטה לתוך הדשא העדין\nוהמלטף, נעים, נוח ואת מאושרת.\n\nאת מבחינה בפרפרים יפהפיים החולפים על פנייך,\nפרפרים בשלל צבעים, גוונים, צורות וגדלים. ובעודך\nשוקעת עמוק יותר ונרגעת עמוקות עוד ועוד, את מוצאת\nאת עצמך נחה בעדינות על הדשא הרך, מוקפת בצבעים\nהיפהפיים האלו ואת רגועה ושלווה לחלוטין.\n\nבעודך שוכבת בנוחות ובשלווה ונרגעת על הדשא\nהירוק והרך, נושמת עמוק, לאט, בקלות, בשמחה\nוברוגע, את מבחינה שלהקות הפרפרים באות והולכות,\nסובבות ומסתחררות, משנות צורה ומתערבבות זו בזו\nויוצרות צורות יפהפיות בצבעים מרהיבים, ויופיים\nמשפיע על רגשותייך. גופך ומוחך סופגים את הרוגע\nואת הזרימה שלהם ומאפשרים לך לשקוע עוד ועוד\nלתוך שלווה עדינה.\n\nכעת את מבחינה שבאופן כמעט פלאי, הפרפרים\nהמגוונים בצבעוניותם יוצרים רצועות של צבעים כמו\nאור החודר דרך מנסרה, וכל צבעי הקשת נגלים לנגד\nעינייך. הצבעים פועמים בעדינות בקצב גופך, בשעה\nשהפרפרים מסתובבים ומסתחררים בעדינות. כמה\nמרגיע. כל כך מרגיע וכל כך שלו.\n\nכעת הפרפרים מרחפים בשקט, נפרדים ומתרחקים עד\nשהם נעלמים לחלוטין. אז מגיעה לכיוונך, כמו ענן רך,\nלהקה סגלגלה של פרפרים עדינים, שגווניהם רבים,\nמאדום בהיר ועד כחול מרגיע.\n\nוכשהפרפרים מסתובבים אחד סביב האחר את חווה\nאת האנרגיה של הצבע הסגול, הזורמת ברכות סביבך\nובתוכך, ומקנה לך ביטחון ואמון. לאנרגיה הזו יש\nהשפעה נהדרת על מוחך, והיא ממלאת אותך ברוגע,\nבשמחה, ובשלווה ומקנה לך שלווה שתלווה אותך\nבמשך כל ההיריון והלידה. את חשה רגועה ובטוחה,\nותחושות נפלאות אלו מאפשרות לך לסמוך על התבונה\nהפנימית שלך ולשקוע בשלווה עמוקה יותר, בטוחה\nיותר ויותר.\n\nראי עכשיו כיצד הפרפרים האדומים נפרדים ועוזבים\nכגוף אחד, מתרחקים, באופן פלאי הצבע המקיף אותך\nומתפשט בתוכך הופך לכחול המדהים של להקת\nהפרפרים שנותרה - צלול, שלו, כמו התכלת ביום\nבהיר, והכחול הזה מרחף ברכות מסביבך ובתוך פלג\nגופך העליון; הוא מביא עמו קלילות ויופי לעולמך,\nועמם גם שמחה עדינה ורכה. תחושה של רוגע, שלווה\nורווחה עוטפת ומרגיעה אותך, ואת שוקעת בנוחות עוד\nועוד. את מבחינה שנשימתך הופכת לרכה יותר קלה,\nיותר והכחול הנפלא הזה משתלב בהרמוניה מוחלטת\nעם צווארך, כתפייך, גרונך, בעודם נרגעים עוד ועוד,\nוהופכים רכים יותר ויותר. את משתמשת במילים\nעדינות וחיוביות, בשיחותייך הפנימיות עם עצמך וגם\nכשאת משוחחת עם התינוק שלך, את מרגישה שכל\nשרירי גופך התרככו לגמרי. את חשה רגועה וחסרת\nמשקל... תחושה עמוקה של רווחה ואמון.\n\nכעת להקה של פרפרים צהובים מצטרפת חרישית\nללהקת הפרפרים הכחולים המרקדים וסובבים ברוח\nהקלה, והצבע סביבך הופך לירוק בהיר של אביב, זמן\nשל התחלות חדשות, זמן שבו גופך מלא חיוניות בריאה\nומלא במרץ של חיים חדשים. השילוב הזה של פרפרים\nכחולים וצהובים, והיעלמותם כצבעים נפרדים, מחלחל\nאלייך באנרגיה של הירוק, ירוק המשמח אותך ומרגיע\nאת לבך, שבו את חשה כעת שמחה ואהבה, ומעמיק\nאפילו עוד יותר את הרוגע והשלווה שלך. את עטופה\nבשמחה ובאהבה לתינוק\n\nשלך, ואת חווה חיבור עמוק יותר עם הישות החדשה\nוהקטנה שבתוכך. עם הירוק החדש והעדין הזה, את\nמרגישה כל כך קרובה לטבע שעוטף ומלטף אותך. את\nעטופה לגמרי בתחושה נפלאה של רוגע ושלווה\nשהטבע מביא עמו לכל דבר שהוא נוגע בו - מטה-\nמטה.\n\nשימי לב כעת שהפרפרים הכחולים נעלמים, כולם\nביחד, ורק הפרפרים הצהובים נותרים, כמו ריקוד\nמנצנץ של פריחה צהובה, המשרה שלווה ורוגע על פלג\nגופך המרכזי. את מרגישה את הפרפרים מרחפים\nסביבך, הם אינם נוגעים בך, אך הרטט הקל שהם\nיוצרים באוויר מלטף את מרכז גופך, ואת חשה שהוא\nזורם דרכך, מושך ומכניס אותך למצב עמוק יותר של\n\nרגיעה והרמוניה, ואת שוקעת עמו מטה-מטה. הנשימה\nשלך נטולת כל מאמץ ועדינה יותר, השרירים שלך\nרפויים וגופך רגוע.\n\nואז את מבחינה שהלהקה הופכת באופן מופלא לכתום\nבהיר; כאשר להקת פרפרים אדומים מתמזגת עם\nהצהובים, וככל שמספרם גדל היא משנה את הצבע\nמצהוב לכתום כצבעו הפנימי של מלון. את מרגישה\nששנוי צבעים זה משפיע במיוחד על בטנך המוסיפה\nלהתרכך ונרגעת; את נקשרת עוד יותר לתינוק, שאותו\nאת חשה גדל בתוכך. כל זה מרגיע ומרכך את גופך בכל\nאזור הבטן, ואת נרגעת עוד ועוד, ומוכנה ללידה של\nהתינוק - גופך ומוחך מתקרבים זה לזה בשלווה,\nמטה-מטה.\n\nכעת צבעי הפרפרים מתחלפים שוב ולהקת הפרפרים\nהצהובים מתעופפים למקום אחר, כך שהצבע הופך\nלאדום עמוק ועשיר המביא עמו רוגע ושלווה העוטפים\nאת האגן שלך ואת פלג גופך התחתון. את מלאת ביטחון\nואמון. את רגועה, שלווה, שמחה, ואת מרגישה\nשהעתיד צופן לך דברים טובים. את בוטחת בטבע,\nבוטחת באינטואיציה שלך ובוטחת בתהליך הטבעי של\nההיריון ושל הלידה. את יודעת שגופך תוכנן ללדת\nבטבעיות ולעבוד ביחד עם התינוק שלך בעת המעבר\nהחלק שלו אל העולם. תחושות\n\nנפלאות אלו מאפשרות לך לנוח ולשקוע עוד ועוד,\nבטוח יותר ויותר, והן מקיפות את כל גופך, מוחך\nורוחך.\n\nכעת קורה דבר נפלא. הפרפרים האדומים הבוהקים\nבצבעם, נעלמים בשקט ואת מבחינה שענן זוהר של לבן\nטהור מלטף אותך כאילו שהצבעים שסובבו אותך\nהותירו מאחוריהם את תמציתם ויצרו בטבעיות את\nהאור הלבן שבתוכו את כרגע שוכבת. כל כך עדין עד\nשאת בקושי מרגישה, בעדינות רבה כל כך את חשה\nברכות הנספגת לתוכך. תחושות אלו של שלווה, רוגע,\nביטחון, ושמחה אינסטינקטיבית, מזכירות לך שלידה\nטבעית, שמחה, נינוחה, בריאה ורגועה, לך ולתינוק\nשלך, היא טבעית כמו שלל צבעי הפרפרים שסבו\nסביבך, ועטפו אותך בזרימתם הרכה; כמוהם גם הלידה\nשלך היא חלק מהטבע.\n\nאז כעת את יודעת שהכול טוב; הכל טוב מאוד. את\nיודעת שהלידה שלך היא תהליך טבעי לחלוטין, כמו\nשהטבע רצה ואת נושאת בתוכך את הזיכרון של\nהחוויה הנהדרת והמעצימה של צבעים ורוגע.\nהיה כל כך נעים, ואין צורך בדבר נוסף, לכן יהיה זה\nטבעי לחלוטין לעבור מחוויה זו לשינה עמוקה ושמחה\nולהתעורר בזמן המתאים, מלאת שמחה, רעננה, רגועה\nבציפייה מלאת ביטחון ואמונה לבואו של התינוק שלך,\nבטבעיות, וברוגע. אם כך את רוצה לסיים התעלמי\nמהספירה שלי, ועברי עכשיו למצב שינה.\nאם ברצונך לחזור למצב ערות, פעלי לפי הנחיותיי\nוהאנרגיה תחזור אליך בקלות ובטבעיות. אני אתחיל\nלספור כעת. חמש - התחילי להיות מודעת לספירה\nשלי. ארבע - התחילי להחזיר לעצמך אט-אט את\nהשליטה על שרירי הגוף. שלוש - הרגישי את\nהאנרגיה חוזרת אליו. שתיים - שימי לב לקולות\nסביבך. אחת - לבסוף, עיניך נפקחות בעדינות ואת\nמרגישה שמחה, רעננה, רגועה, מלאת ביטחון ואמון\nבגופך ובתהליך הטבעי של הלידה.\n","images":["97e963b4","4b254df1","f5a74379","816fc35e","2769f386"],"audio":"colors"},{"id":"fear","title":"שחרור פחדים: ביטחון ועצמה","text":"שבי לך בנוחות והרגעי. כעת הניחי לעינייך להיעצם,\nלאט ובעדינות. פשוט הרפי, הרפי, הרפי. שימי לב\nלנשימה שלך, כמה רכה ושקטה היא נעשית, כשאת\nנרגעת אפילו עוד יותר.\nאת יכולה להרגיש כעת רגועה בכל גופך, ואת מאפשרת\nלגל של חום ושביעות רצון לשטוף את כל כולך. הגל\nמתחיל בקצה ראשך, כאור עדין, חם וזהוב החודר אלייך\nברכות. הוא נשטף כלפי מטה מראשך לעפעפיים,\nמסביב לעיניים, ללחיים, לשפתיים, ללסת שלך. הכול\nרגוע ושלו. תני לתחושה זו להתפשט כלפי מטה\nלצווארך, לכתפייך ולמטה לידייך. הוא זורם לאט לחזה\nשלך, דרך הבטן, לאגן, כל הדרך במורד הירכיים,\nהברכיים, השוקיים וכפות הרגליים, עד שהוא מגיע\nלבהונות שלך, וכל חלק בגופך רגוע לגמרי תודות לזוהר\nהזהוב הרגוע הזה.\nהכול סביבך מסייע לך להירגע באופן עמוק יותר, עוד\nועוד - הנשימה שלך, המוזיקה, קולי השקט. אפילו\nרעש בלתי צפוי, כמו רעש של רכב חולף, קולות בחוץ\nאו טלפון מצלצל, אלו ישמשו לך כאות לאפשר לעצמך\nלהירגע אפילו עוד יותר.\nובדיוק כשאת חושבת שאת הכי רגועה, את מתחילה\nלהירגע באופן עמוק יותר.\nכעת דמייני שאת ניצבת בראש גרם מדרגות רחב, בטוח,\nעשוי מאבן או מעץ יפהפה, מכוסה בשטיח רך, ואת\nעושה צעד ראשון בכיוון מטה. עשר... כף רגלך יורדת\nבבטחה למטה אל המדרגה הראשונה ואת מתחילה את\nדרכך במורד המדרגות. תשע... את מרגישה שאת\nשוקעת עמוק יותר בהרפיה הזו בעודך יורדת למדרגה\nהבאה, עמוק יותר ויותר. שמונה... כשאת יורדת מדרגה\nנוספת את שוקעת עמוק יותר בתוך עצמך. שבע... כל\nגופך נעשה חסר משקל לחלוטין. שש... את מרחפת על\nגל של רוגע הדומה\n\nלענן רך. חמש... עמוק יותר, עמוק יותר. ארבע... נכנסת\nלתוך עצמך באופן עמוק ורצוני. שלוש... את ממוקדת\nמאוד בתוך עצמך ודבר לא יכול לגעת בך פרט לפנימיות\nשלך עצמך, התבונה שלך, האינטואיציה שלך. שתיים...\nהכול נעלם חוץ מהמחשבות שלך. אחת... את מרגישה\nרגועה לגמרי באופן עמוק ונהדר, את משוחררת\nמדאגות, ואת מאושרת ושלווה. אפילו מחשבותייך\nדוהות ונשכחות. כל כך עמוק, כל כך, כל כך עמוק.\nנוחי, פשוט נוחי לך שמחה ורגועה לזמן מה... יש שפע\nשלזמן....\n\nכעת דמייני לך יום אביבי, שמיים בהירים ואת נחה על\nדשא רך מתחת לעץ על שפת הים. בריזה חמימה\nועדינה נוגעת בקלילות בלחייך. את לגמרי שלווה,\nשמחה ורגועה.\n\nאת מתבוננת למעלה ומבחינה שעל העלים של העץ\nישנן תמונות של כל הזיכרונות השמחים שלך, כל\nהאירועים החיוביים בחייך, אך על חלק מהם ישנן גם\nתמונות של דברים מצערים שקרו לך בחייך, הגורמים\nלך לתהות בנוגע ללידה שלך. כשאת מתבוננת בעלים,\nאת מבחינה שחלק מהתמונות על העלים מזכירות לך\nדברים ששמעת או קראת או חשבת עליהם, דברים\nהנוגעים לדאגותייך בעניין הלידה או חוויות לידה\nאישיות שלך. כשאת בוחנת את העלה הראשון, את\nמבחינה שהתמונה שעליו דוהה בהדרגתיות ונספגת\nלתוכו. אז הוא הופך לצהוב, לחום ואז לזהוב. אלו צבעי\nהסתיו. המשמעות היא שהעלה הגיע אל סוף ימיו -\nכעת אין לו ולדאגה המשוייכת לאותו עלה כל משמעות\nוהוא נושר מהעץ ונוחת תחתיו.\n\nכעת את מבחינה בעלה נוסף, שעליו תמונה של דאגה\nנוספת. גם התמונה הזו דוהה ונספגת לתוך העלה\nהמשנה את צבעו לצהוב, לחום ולזהוב, נושר ונופל\nלאדמה ומצטרף לעלה הראשון.\n\nבעודך מתבוננת, צפה בכל פעם דאגה במוחך, עלה\nמסוים\n\nנושא את התמונה של אותה דאגה, ולאחר מכן היא\nנעלמת, והעלה משנה את צבעיו ונושר.\n\nאת מבינה כעת שאת יכולה לראות את כל הדאגות שלך\nעל העלים, ואת מקדישה את כל הזמן שנדרש כדי\nלטפל בדאגותייך הנוגעות ללידה או כל דבר אחר\nהעולה במוחך ואת רוצה לשחרר בקלות - את רואה\nשפעם אחר פעם התהליך חוזר על עצמו. התמונה של\nכל דאגה מופיעה על עלה, נספגת לתוכו עד שהיא\nנעלמת לגמרי. כל העלים הנושאים דאגות משנים את\nצבעיהם בגוונים של הסתיו - צהוב, חום וזהב, נושרים\nלאדמה, לוקחים עמם את הדאגות שנעלמו עמם,\nוכשהתהליך מסתיים, את מטאטאת את העלים\nלערימה.\n\nכעת רק עלים ירוקים ושמחים נותרו על העץ ואת תוהה\nמה לעשות בערימת העלים שנשרו. יש לך רעיון - את\nמחליטה לעשות מדורה ולהזמין אליה את כל האנשים\nשעזרו לך בעבר, או שעוזרים לך בהווה או יעזרו לך\nבזמן הנהדר והחשוב הזה בחייך. עוד מעט כולם\nמגיעים. כולם באים. שניכם שם כמובן, אימא שלך\nואבא שלך, בני משפחה, חברים מכל התקופות בחייך,\nאפילו חברים מבית הספר, אולי אנשים שלימדו אותך,\nהמיילדת שלך, השכנים שלך, מעסיקים, קולגות, כל מי\nשאי פעם עזר לך או תמך בך, ואלו אשר יתמכו בך\nבהמשך ההיריון ובעת לידת התינוק שלך.\n\nכשכולם מגיעים, וההתקהלות הגדולה מלאת שמחה,\nאת מדליקה את המדורה. המדורה מתלקחת מהר\nוהעלים שנשאו את כל הזיכרונות המעציבים מתחילים\nלבעור ומסתלסלים בלהבות המפצפצות. בעודם\nנשרפים ומסתלסלים הם הופכים לאפר, והאפר נישא\nבחום, וכשהוא עולה, הבריזה העדינה נושאת אותו אל\nעל ומעיפה אותו אל הים הפתוח. את צופה בו מרחף\nהלאה והלאה מעל המים עד שהוא לגמרי נעלם\nמעינייך, וכשהוא לגמרי נעלם,\n\nהזיכרונות והתחושות הללו שנשאו העלים נעלמים\nלחלוטין\n\nעמו, נעלמים לעד, מותירים אותך כל כך בטוחה\nורגועה, שלווה ומאושרת.\n\nאת מרגישה כל כך בטוחה כי את מבינה שכעת את\nמקבלת את עצמך לחלוטין, ומקבלת את הכוח\n\nהאינטואיטיבי שלך לשלוט בחייך ולדאוג לעצמך\nולתינוק שלך. גם אם כל האנשים האלו עזרו לך, עדיין\nעוזרים לך או עתידים לעזור לך, את מבינה, שאמנם את\nמקבלת את עזרתם, בשמחה ובהוקרה, אך את שולטת\nבחייך, את ורק את מחליטה כיצד דברים מתנהלים,\nוכיצד האנשים האלו יוכלו לעזור לך כדי שהתינוק שלך\nייוולד בקלות ובשמחה, ייכנס לעולם בדרך הטובה\nביותר ויעניק לך חוויה מעצימה ושמחה. ובעוד את\nחווה תחושה נהדרת של ביטחון עצמי ושמחה\nהאורחים שלך נעלמים אט-אט ומותירים אותך עם האני\nהחדש שלך, כי הם יודעים שאת יכולה לבקש את\nעזרתם כשתרצי, ואת יודעת מתי וכיצד תזדקקי לתבונה\nשלהם, לניסיון שלהם ולידע שלהם.\n\nמחשבות אלו מסייעות לך להבין שאת יכולה להחליט\nכיצד\n\nאת רוצה שתתרחש לידת התינוק שלך. את מחליטה\nאיך תהיה הלידה, וכמה זמן היא תימשך. היא תימשך\nפחות משבע שעות, פחות מארבע שעות, שעתיים?...\nקחי לך זמן לבחור... חשבי גם עד כמה הלידה נוחה,\nכמה רגועה ורפויה. זכרי שגופך נוצר ללדת בעדינות\nובטבעיות, בזמן הנכון ובמקום הנכון, כדי לאפשר\nלתינוקך מעבר קל ושלו אל העולם, שאחריו את\nמחזיקה לראשונה את תינוקך היפה בזרועותייך. את\nרואה כעת שקל לך להחליט את כל ההחלטות הללו\nבזכות הביטחון החדש שלך, בזכות הכוח שהוא מקנה\nלך והשמחה והרוגע שהוא מביא לך - כל אלו\nמאפשרים לך לשקוע עמוק לתוך שלום ושלווה, ביטחון\nורווחה.\n\nכעת את מביטה בהכרת תודה בעץ ובכל עליו הירוקים\nהנושאים את הזיכרונות הנעימים ומשהו נפלא קורה.\nהעלים\n\nנפרדים מהענפים ויוצרים מסגרת של תמונה בצבע\nירוק, ובתמונה זו את, שניכם, עם התינוק שלכם\nבזרועותייך. את נראית כל כך שמחה וקורנת, את יודעת\nשהכול קרה בדיוק כמו שדמיינת. התינוק שלך ישן\nבעדינות על זרועך, כל כך מתוק, עדין ובטוח. את מלאה\nבאהבה ובשמחה.\n\nנראה שהתמונה מרחפת בעדינות מהעץ כלפי מטה\nוהיא הופכת להיות בגודל טבעי ועוטפת אותך, וכעת,\nכמו בדרך נס, את מבחינה שאין זו תמונה כלל - זוהי\nהמציאות ומה שהיה נראה כתמונה של שניכם עם\nהתינוק שלכם זו בעצם המציאות. את מרגישה אושר\nגדול בגלל הצלחתך. רכות עדינה מקיפה אותך כשאת\nמביטה בפנים של התינוק שלך; הוא פוקח את עיניו\nומסתכל לתוך עינייך. הכול כל-כך מושלם כפי שתכננת\nשיהיה, ואת זוכרת את התחושה הנפלאה הזו שוב ושוב\nעד היום שזה באמת יהפוך למציאות.\nבעוד דקה תחזרי למציאות היומיומית, אך למציאות\nאחרת, שכן את זוכרת את כל מה שחווית כרגע ואת\nהשמחה שלוותה אותך וממשיכה ללוות אותך במשך\nההיריון, בזמן הלידה ולאחר הלידה של התינוק שלך.\nכשאני סופר מחמש לאחת חזרי בעדינות ובהדרגתיות\nאל ההווה. חמש... את נעשית שוב מודעת לגופך.\nארבע... את חשה בעדינות תנועות קטנטנות\nבאצבעותייך ובבהונותייך. שלוש... העפעפיים שלך\nנעשים קלים יותר.שתיים... את מרגישה ערנית, רגועה\nשמחה ורפויה. אחת... עינייך נפקחות בעוד את שוב\nמצטרפת אליי בשקט ובעדינות.\nזה עתה טיפלת בדאגותייך. זוהי אינה הרפיה ושחרור לתרגול\nיומיומי, אלא לשימוש אם משהו מוציא אותך מאיזון, כמו סיפור\nלידה שלילי במיוחד או שקרה משהו שלא ציפית לו. אם זהו\nהמצב, היעזרי בהרפיה הזו שוב כדי להתמודד עם הנסיבות או\nעם כל דבר אחר שעלול לצוץ. זהו כלי מיוחד לשימוש באירועים\nמסוימים.","images":["cfbbaec9","54d7dd2e","ec0e099d","e12a8ef3","3762bf80"],"audio":null},{"id":"life","title":"חיים מתפתחים","text":"נדמה שעבר זמן כה רב מאז שהחוויה הזו החלה ובו\nזמנית נדמה שזה עבר כל כך מהר: מהרגע שבו נוצרו\nחיים חדשים בתוך גופך, עמוק בתוכך, עד לרגע שבו את\nמחזיקה בתינוק שלך בזרועותייך. תחושת נס אמיתית.\nוזהו אכן נס - נס תחילתם של חיים חדשים מכלום\nואת זו המחוללת את הנס הזה.\nהתינוק שלך הוא כבר אדם קטן בפני עצמו, זז ובועט\nבתוכך. הטבע כהרגלו מביא עמו חיים חדשים ואת\nמקבלת את המתנה הנפלאה כאשר התינוק שלך מחליק\nבעדינות אל העולם.\nאת חווה את זה ואת השינויים העמוקים ומשפרי\nהחיים שנלווים לכך, וגם התינוק שלך ישתנה ויתפתח\nבכל כך הרבה דרכים חיוביות ומלבבות. השנויים הללו\nהם תוצאה מוצלחת ומשמחת של חודשי ההיריון.\nמחשבותייך החיוביות והשמחות גדלות ומתעצמות\nכשאת מבינה שהכול טבעי ונכון, ואת נעשית יותר\nויותר בטוחה בעצמך, שלווה ורגועה. ככל שאת נרגעת,\nככל שאת משתחררת וככל שאת בטוחה יותר, כך את\nשמחה יותר, והמעגל המועיל והמעצים הזה גורם\nלדברים לקרות בצורה הטובה ביותר עבורך ועבור\nהתינוק שלך.\nההנאה היום מהתהליך מסייעת לך פיזית, מנטלית\nורגשית, ואת נהיית חזקה יותר ובטוחה בעצמך. הכוח\nוהביטחון מעניקים לך יותר כוחות טבעיים ומגדילים\nאת השמחה ואת הציפייה ללידה המהירה והעדינה של\nהתינוק שלך.\nאת כל כך רגועה, לגמרי שלווה, בגופך ומוחך. מה שאת\nמדמיינת יקרה, ואת משמרת את הידיעה הזו ואת\nהביטחון שלך, ללא קשר לדברים שאנשים אחרים\nעשויים לומר או להציע, כי את יודעת בביטחון מלא\nשחוויית הלידה שלך תהיה טבעית ועדינה.\nלכי אחר האינסטינקטים שלך. תסמכי על התבונה\nהפנימית שלך.\n\nחווית הלידה שלך תהיה כפי שהחלטת, כפי שקבעת,\nכפי שהבטחת לעצמך. החוויה תהיה רגועה, שלווה\nומעצימה בזמן שגופך עובר בטבעיות תהליך פלאי של\nלידת התינוק שלך. אין דבר מדהים יותר מחווית פלא\nהלידה.\n\nכשגופך משחרר את תינוקך בעדינות אל העולם ואל\nתוך זרועותייך, הדברים שלמדת מסייעים לך להיכנס\nעמוק יותר ויותר לתוך הרפיה מוחלטת. גופך, מוחך\nותינוקך, פועלים יחד בהרמוניה מושלמת כך שהתהליך\nמתקדם בצורה חלקה וטבעית. מוחך רגוע ושלו. הכל\nקורה באופן כל כך רגוע וחלק.\n\nאת נרגעת בביטחון ובעדינות בשעה שגופך מתרכך\nונפתח. תינוקך מצטרף אלייך בתהליך הטבעי, הנפלא\nהזה, ושניכם פועלים יחד אינסטינקטיבית בזמן המיוחד\nהזה, הנשימה שלך קלילה ואיטית, עמוקה ונוחה,\nוהתינוק שלך מחליק בעדינות אל העולם כשאת\nממתינה בסבלנות ובשמחה לאחוז בתינוקך שזה עתה\nנולד.\n\nזהו תהליך טבעי אדיר והטבע יודע בדיוק מה לעשות.\nהטבע מייצר גלים עולים ויורדים כמו הגלים בים. גלים,\nשפל, זרימה, כולם נושאים אותך כמו גלים הנמשכים\nאל החוף, כמו הים שנשטף על החול. את נמשכת על\nידי הדמויים הללו, את נושמת אתם באיטיות\nובהרמוניה, עמוק ובעדינות. כשם שהים שוטף ומחליק\nאת החול, כך נרגע גופך באמצעות התרופה הטבעית\nשלו - אנדורפינים. בהרמוניה מוחלטת עם הטבע,\nתינוקך וגופך הרגוע.\n\nהכול טוב. הכול טוב מאוד.\n\nככל שהחוויה מעמיקה, גם את מעמיקה לתוכה, וככל\nשאת מעמיקה את נרגעת יותר, הנשימה שלך רגועה\nוקלה יותר, גופך זורם יותר בקצב הטבעי שלו, ותינוקך\nמצטרף אלייך בכניסה חלקה יותר אל העולם.\n\nהרפי, הירגעי, הכול טוב, הכול עדין, הכול טבעי. הניחי\nלגופך ולמחשבותייך לזרום עם הגאות והשפל\nולהתמלא בביטחון ובשלווה לקראת המועד שבו\nתינוקך ייוולד.\n\nכעת דמייני את הרגע הזה מגיע. הביטי כעת בתינוק\nשלך נכנס לעולם. הביטי כעת, במקום שבו גופך שמר\nעליו בבטחה ובנוחות, זרועותייך אוחזות בו כעת בחום\nובאהבה, והעיניים שלו נפקחות ומביטות אל תוך\nעינייך.\n\nזוהי הפסגה של כל החודשים המיוחדים של ציפייה\nשמחה, של הכנה. כעת הבאת את תינוקך אל העולם\nבטבעיות ובאהבה. תמיד ידעת שאת יכולה לעשות זאת\nועשית זאת. תמיד ידעת שכך זה יקרה.\n\nשניכם כל כך שמחים וגאים כשאת נרגעת עם תינוקך\nה\"עטוף\" בזרועותייך.\n\nהכול טוב.","images":["9c09f705","0bc6add3","efae7624"],"audio":null}],"relaxPractice":"\nייתכן שתרצי להיעזר בהרפיות אלו בשלבים המוקדמים של\nהלידה אך אנא תרגלי אותם לפני הלידה, שכן בכל פעם שאת\nמתרגלת, את לומדת להירגע עוד יותר ולשחרר את הפחדים\nוהמתחים הנוגעים ללידה.\nישנה עוד הרפיה שניתן גם לבחור בה לצורך תרגול. הרפיית\n\"מרבד הקסמים\" היא הרפיה שאנשים רבים\nמדווחים כי היא מרגיעה במיוחד.\nתוכלי לקרוא לעצמך את הרפיית \"צבעים ורוגע\"\nאו שיקריאו לך אותה לפני השינה.\nשתי הרפיות אלו מצויות בדיסק של KG היפנובירת'ינג, כמו\nגם כל יתר ההרפיות בספר זה. \"צבעים\nורוגע\" היא הרפיה נהדרת לשימוש כשאת נרדמת בכל לילה.","affirmations":"■ אני מתקדמת בהיריון ובלידה בעדינות, בביטחון\nובאמון.\n■ אני רואה את לידת התינוק שלי כטבעית, בריאה,\nחלקה וקלה.\n■ אני מִתִרְגָּלֶת כדי להיות רגועה ושלווה בזמן הלידה.\n■ לידה היא תהליך טבעי של הגוף שלי; התודעה שלי\nוהנפש שלי העובדים יחד עם התינוק שלי.\n■ אני מודעת לתבונה הפנימית של גופי ולאינטואיציה\nשלי ובוטחת בהן שיובילו אותי במשך ההיריון ובזמן\nהלידה.\n■ אני סומכת על תהליך הלידה האינסטינקטיבי הנרקם\nבטבעיות בתוך גופי.\n■ המחשבות שלי מובילות וגופי פועל בעקבותיהן.\nכשמחשבותיי רגועות, בטוחות ושלוות, גופי חש\nבנוחות, ברוגע וברכות ונפתח כאשר התינוק שלי מגיע\nבעדינות, בבריאות ובמהירות אל תוך העולם.\n■ כשאני חשה את התינוק שלי זז בתוכי, האהבה\nוהחיבור שלי אליו גוברים ומעמיקים.\n■ אני ניגשת ללידת התינוק שלי באופטימיות\nובביטחון.\n■ אני אוכלת אוכל בריא ומטפלת בגופי למעני ולמען\nהתינוק שלי.\n■ אני מתרגלת רגיעה עמוקה ומעמיקה את הביטחון\nוהאמון שלי.\n■ אני בטוחה בידיעה שאני מוכנה לחלוטין ללידה\nטבעית, קלה ומהירה.\n■ אני מלאת ביטחון שלידה טבעית הינה בטוחה עבורי\nועבור התינוק שלי.\n■ אני בוחרת במטפלים הטובים ביותר במהלך ההיריון\nובמהלך הלידה של התינוק שלי.\n■ אני בוחרת במקום הטוב ביותר שבו התינוק שלי\nייוולד בלידה טבעית ורגועה.\n■ אני נהנית מתחושות של שלווה טבעית, רוגע ורכות\nהעוטפות את גופי.\n\n■ כשאני מתקדמת בעדינות בגלים ובלידה, אני שוקעת\nעמוק יותר ויותר לתוך רגיעה ושלווה.\n\n■ כל נשימה שלי איטית, ארוכה, עמוקה ורגועה.\n\n■ בכל גל אני נושמת עמוק, מתמקדת כלפי מעלה\nועובדת ביחד עם הגוף שלי.\n\n■ בכל נשיפה אני נושפת החוצה את כל המתחים\nוהדאגות.\n\n■ בכל שאיפה אני שואפת פנימה רוגע, נוחות, שלום\nואמון.\n\n■ מחשבותיי חיוביות, אני חשה בטוחה ואופטימית\nומצפה ללידת התינוק שלי.\n\n■ במהלך הלידה אני מתחברת באופן מעמיק יותר\nויותר לתבונה הפנימית שלי ולאינטואיציה שלי.\n\n■ אני זורמת עם הקצב הטבעי של הגוף שלי המשחרר\nאת התינוק שלי בעדינות ובקלות אל העולם.\n\n■ אני בוטחת בגופי ובתינוק שלי שהם בריאים, רגועים\nושלווים.\n\n■ התינוק שלי מתמקם בטבעיות בתנוחה הטובה ביותר\nללידה טבעית, חלקה ורכה.\n\n■ גופי והתינוק שבתוכי נוצרו בגודל המתאים כדי\nשאוכל ללדת בטבעיות.\n\n■ התינוק שלי נולד בזמן הנכון ללידה טבעית, מהירה\nורכה.\n\n■ אני סומכת על התהליך הטבעי של הלידה הנרקם\nברכות בגופי ובגופו של התינוק שלי.\n\n■ כל גל בגופי מזכיר לי שעוד מעט אחזיק בתינוק שלי\nבין זרועותיי.\n\n■ אני מקבלת בשלווה שהלידה שלי מתאימה לחלוטין\nלי ולתינוק שלי.\n\n■ אני נרגעת בצורה עמוקה יותר ויותר ככל שהלידה\nשלי מתקדמת והתינוק שלי קרוב יותר להיוולדו.\n\n■ אני מרגישה רגועה, שלווה ונינוחה.\n\n■ בכל גל הנשימה שלי איטית ועמוקה, גופי רגוע\nומחשבותיי רגועות.\n\n■ אני סומכת על גופי, על האינסטינקטים שלי ועל\nהטבע שיובילו אותי ואת התינוק שלי בבטחה בתהליך\nהלידה.\n\n■ ככל שהלידה מתקדמת, הרגיעה שלי מעמיקה וגופי\nמתרכך, נפתח ומתרחב עוד ועוד.\n\n■ לאחר שהתינוק שלי נולד, ברכות, ברוגע ובבריאות,\nהשליה נפלטת אחריו בקלות ובטבעיות.\n\n■ התינוק שלי נע בקלות אל תוך העולם, השליה אחריו\nוכלי הדם שלי נסגרים באופן טבעי ובריא.\n\n■ יש לי שפע של חלב לתינוק שלי ואני מזינה אותו\nבקלות ובנוחות.\n\n■ התינוק שלי יונק ממני בקלות.\n\n■ גופי תוכנן ללדת ביעילות ובקלות.\n\n■ אני בחרתי להיות רגועה, שלווה ובטוחה בזמן\nהלידה.\n\n■ התינוק שלי נולד בריא, ערני ושלו.\n\n■ אני מקבלת את התינוק שלי בעונג ובאהבה","affirmationIntro":"\nלהלן תמצאי משפטים שנועדו להעצים אותך כהכנה\nשתאפשר לך ללדת את תינוקך כשאת מלאת בטחון. משפטים\nחיוביים אלו על הלידה הם פשוטים מאוד ואפקטיביים במיוחד.\nאת יכולה להאזין להם או לקרוא אותם בעצמך, בקול או בשקט.\nהשתמשי בחושייך השונים במהלך התרגול - בחוש הראייה,\nאם את מקריאה לעצמך או בחוש השמיעה אם בן זוגך מקריא לך\nאותם או אם את קוראת בעצמך בקול או מאזינה לדיסק.\nאינך צריכה לקרוא את כל המשפטים בבת אחת, את יכולה\nלקרוא חלק מהם ובפעם אחרת עוד כמה. אם יש משפט שאת\nאוהבת במיוחד, כתבי לך אותו על דף ושימי בכיסך או בתיק, כך\nתוכלי להוציאו במהלך היום ולקרוא אותו.\nלזוג שלימדתי היה לוח מחיק במטבח ששימש לרשימת\nהקניות שלהם. לפעמים היה הבעל יורד למטבח בבוקר ורושם על\nגבי הלוח משפט חיובי אחד לקראת בואה של אשתו. כל כמה\nימים הוא נהג להחליף את המשפטים כהפתעה עבורה.","pelvic":"תרגילי חיזוק והרפיה לרצפת האגן\nאנשים מדברים עד לזרא על תרגילי רצפת האגן, והבעיה היא\nשהם כל כך משעממים. את בטח שוכחת לתרגל ואז את הולכת\nלישון ומחליטה שלמחרת תתרגלי, אך למחרת קורה בדיוק אותו\nהדבר.\n\nתרגילי רצפת האגן משמשים לשתי מטרות: האחת, את\nמכווצת את שרירי רצפת האגן, מתחילה בשריר של פי הטבעת\nומתקדמת קדימה לכיוון הנרתיק ולמעלה לתוכו, מחזיקה לכמה\nשניות ואז מרפה. הכיווץ חשוב כי הוא מחזק את השרירים\nושרירים מחוזקים פועלים טוב יותר. ההרפיה חשובה גם כן כי\nאת מרגילה את גופך לשחרר ולהרפות כשאת מרגישה במתח,\nוכשאת מרגישה בלחץ ראשו של התינוק היורד בתעלת הלידה,\nאת מרפה ומסעו של התינוק שלך אל תוך העולם קל יותר עבור\nשניכם. מסיבות אלו חשוב לבצע את תרגילי רצפת האגן עד\nשיהיו קלים לביצוע עבורך.\n\nהפכי את התרגול להרגל כך שתבצעי את התרגילים\nאוטומטית ברגעים מתים של היום, לכולנו יש כאלו; רובנו\nיושבים מול המחשב ומקללים אותו על האיטיות שלו כשהוא\nעולה או מוריד משהו. אנו יכולים להשתמש בזמן הזה לאמן את\nשרירי רצפת האגן. את יכולה לשים על המסך פתק שכתוב עליו\n\"תרגילי רצפת האגן\" או קוד כמו \"שרה\" (שרירי רצפת האגן),\nשאיש זולתך לא יבין. אב אחד סיפר כי הוא מתכנן לשלוח\nלאשתו דוא\"ל כל יום ובו יהיה רשום \"תרגילי רצפת האגן\". זה\nרעיון נפלא, אך טוב מזה יהיה אם הוא ישלח יחד עם ההודעה\nקובץ מצורף וכבד, שייקח הרבה זמן לפתוח אותו.\n\nמועד אחר שבו אפשר לתרגל הוא זמן הנסיעה באוטובוס או\nברכבת בדרכך לעבודה או כשאת נוהגת ברכב בעודך ממתינה\nברמזור האדום. כשהרמזור אדום, כמעט תמיד יש זמן לכמה\nתרגילי רצפת אגן לפני שהאורות מתחלפים שוב לירוק. כל מה\nשצריך לעשות זה לשים פתק על לוח השעונים (dashboard)\nבמשך כמה ימים ולאחר מכן הפעולה תיעשה אוטומטית. לכל\nאחת יש רגעים מתים כאלו המזמנים הזדמנות נפלאה לתרגול של\nשרירי רצפת האגן. לאחר כמה פעמים, את מתכנתת את עצמך\nלעשות זאת, וכך בכל פעם כשאת רואה רמזור אדום את מיד\nמתחילה לתרגל מבלי מאמץ מודע לזכור זאת. בהיפנותרפיה ישנו\nמונח הנקרא \"עוגן\" (אות או טריגר) שהוא למעשה התניה לביצוע\nפעולה כלשהי - הרמזור האדום הוא העוגן לביצוע תרגילי\nהחיזוק וההרפיה של רצפת האגן. את כבר לא צריכה לחשוב על\nכך או לזכור. זה פשוט קורה.","daily":"הצעות לתרגול יומי\n\n■ נשימות UP, עם דימויים עולים, כמו צפייה בזריחה, בועות\nאו כדור פורח. במשך כמה דקות בערב ובבוקר\n\n■ ליטוף גב עדין\n\n■ נשימות DOWN עם דימויים יורדים ונפתחים (גם\n\nבשירותים), כמו דימוי של ורד נפתח, אדוות מים באגם או מפל\nמים\n\n■ בקשי מבן זוגך להקריא לך הרפיה כל ערב לפי השינה (או\nהאזיני להרפיה בדיסק): הרפיית ראש ופנים, הרפיית ליטופים,\nמגע מרגיע\n\n■ האזיני לדיסק \"צבעים ורוגע\" לפני השינה: מרבד הקסמים,\nמשפטים ללידה מעצימה וצבעים ורוגע\n\nוגם:\n\n■ תרגילים לחיזוק רצפת אגן - ברמזור האדום או כשאת\nממתינה למחשב שלך שיתחיל לפעול\n\n■ עיסוי פרינאום והנרתיק בשמן לריכוך הרקמות, בערך החל\nמשבוע 35\n\n■ שמרי על תנוחות זקופות יותר המעודדות את התינוק שלך\nלתנוחה הרגילה ביותר ללידה, כשפניו פונים אל הגב שלך\n\n■ התבונני בתמונה של התינוק שלך בתנוחה הרגילה ביותר\nללידה\n\nתרגלי, תרגלי, תרגלי\n\nמקדי את תשומת ליבך במקום שבו את רוצה להימצא\n\nאת נשימות ה-DOWN את יכולה לתרגל בשירותים, אך עשי\nזאת לפעמים גם עם בן זוגך כדי שתוכלי לתרגל גם את הדימויים.\n\nהחלק הבא בדף התרגול הוא ההרפיות. בחרי את ההרפיה\nהאהובה עלייך ובקשי מבן זוגך להקריא לך אותה בכל לילה לפני\nשאת הולכת לישון.","birth":"השימוש בהיפנובירת'ינג במהלך הלידה\n\nבמהלך הלידה:\n\n■ האם: נשימות UP ביחד עם דמויים כלפי מעלה, ומעבר\nבהמשך לנשימות DOWN עם דמויים כלפי מטה ודימויי פתיחה.\n\n■ האב: הגנה על המרחב של האם ולייצג את רצונותיה, תוך\nשימוש בעידודים עדינים, ליטוף גב, ליטוף זרועות וכתפיים.\nהשמעת הדיסק צבעים ורוגע. הקראת הרפיות כאשר מתאים.\nאספקת מים (ייתכן שעם פרחי באך) וחטיפים לאם (ולעצמך).\nהדבר החשוב ביותר הוא להיות שם עבורה.\n\n■ יצירת אוירה רגועה ושקטה עם מינימום שיחות והפרעות.\n\n■ שימוש בתאורה עמומה, נרות ומוסיקת רקע רגועה.\n\n■ שימוש בשמן אתרי לבנדר, פרחי באך וארניקה אם תרצו.\n\n■ מסירת מכתב ההיפנובירת'ינג למיילדת\n\n■ תהני מהריונך.\n\n■ השארי רגועה ובטוחה בעצמך.\n\n■ אפשרי לגופך היולד ללדת את תינוקך.\n\n■ לידה וטיפול בתינוק הם תהליכים טבעיים.\n\n■ כל מה שתעשי - נכון."};const typed={"upText":"דימויים לנשימות UP\n\nזוהי נשימה ארוכה ואיטית — פנימה מהאף והחוצה מהפה, תוך כדי התמקדות כלפי מעלה.\n\nכשאת שואפת, התבונני בשמש העולה, בוורוד הקסום שנגלה באופק. כשהשמש עולה גבוה יותר, גופך נמשך בעדינות כלפי מעלה.\n\nנשפי כשהשמש ממשיכה לעלות וראי את השתקפות הוורוד בעננים שמעל.\n\nשאפי ודמייני שאת מפריחה בועות סבון שהולכות וגדלות. התבונני בבועות המרחפות מעלה לשמים.\n\nנשפי וצפי בבועות הצפות והנישאות מעלה לשמים בכל נשימה רגועה.\n\nשאפי ודמייני את עצמך עומדת לצד כדור פורח ענק בשלל צבעים שהולך ומתמלא באוויר.\n\nנשפי והביטי כיצד הבלון המתנפח מרחף גבוה בשמים עד שהוא נראה קטנטן.\n\nנשמי לאט ובנוחות.\n\nבכל נשימה מרגיעה, גופך נהיה רפוי יותר ושלו יותר.\n\nנשמי כלפי מעלה בעוד גופך ומוחך פועלים יחד בהרמוניה.\n\nאת עובדת יפה מאוד. זה טוב מאוד.\n\nכל כך רפוי, כל כך רגוע, כל כל שלו.","upExplanation":"ה־UP בזמן גלים בשלב הראשון של הלידה (שלב ה־(UP, וכן לשם תרגול הרפיות לפני כן. השתמשי בנשימות אלו בתרגיל הבא.\n\nבקשי ממישהו שיקריא לך את הטקסט הבא, לאט ובשקט, אולי בליווי מוזיקת רקע נעימה. המוזיקה שאני משתמשת בה לתרגול, והיא גם אידיאלית להשמעה בזמן לידת התינוק שלך, לקוחה מהדיסק: Piano Meditations ,River Dawn"};const app=document.getElementById('app');const groups=[['up','UP','דימויים, הסברים וסיפורים'],['down','DOWN','דימויים, הסברים וסיפורים'],['relax','הרפיות','כל הרפיה בנפרד'],['affirmations','משפטים ללידה מעצימה','לקריאה'],['practice','תרגול והכנה','רצפת האגן ותרגול יומי'],['birth','במהלך הלידה',"השימוש בהיפנובירת'ינג במהלך הלידה"]];
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const text=s=>'<div class="reading-text">'+s.split(/\n\s*\n/).map(p=>'<p>'+esc(p.replace(/\n/g,' '))+'</p>').join('')+'</div>';
const back=(r=false)=>`<a class="back" href="#/${r?'relax':''}">${r?'חזרה להרפיות':'חזרה לחלקי הלידה'}</a>`;
const heading=s=>'<h1>'+esc(s)+'</h1>';
const group=(s,h)=>'<details class="topic-item"><summary>'+esc(s)+'</summary>'+h+'</details>';
const menu=items=>'<nav class="menu">'+items.map(([id,title,detail])=>`<a href="#/${id}"><strong>${esc(title)}</strong>${detail?'<span>'+esc(detail)+'</span>':''}</a>`).join('')+'</nav>';
function render(){let route=decodeURIComponent(location.hash.slice(1))||'/';let h='';
if(route==='/')h=heading('לידה בנחת')+menu(groups);
else if(route==='/up')h=back()+heading('UP')+group('דימויים לנשימות UP',text(typed.upText.replace(/^דימויים לנשימות UP\n\n/,'')))+group('הסבר ותרגול',text(typed.upExplanation))+group('ארוחת ערב בבקתה',text(content.cabin.replace(/^ארוחת ערב בבקתה\n/,'')));
else if(route==='/down')h=back()+heading('DOWN')+group('דימויים לנשימות DOWN',text(content.downImagery))+group('הסבר ותרגול',text(content.downIntro)+text(content.downAfter));
else if(route==='/relax')h=back()+heading('הרפיות')+menu(content.relax.map(r=>['relax/'+r.id,r.title,'']))+group('תרגול הרפיות',text(content.relaxPractice));
else if(route.startsWith('/relax/')){let r=content.relax.find(r=>route==='/relax/'+r.id);if(r)h=back(true)+heading(r.title)+text(r.text)+back(true)}
else if(route==='/affirmations')h=back()+heading('משפטים ללידה מעצימה')+'<div class="affirmations">'+content.affirmations.split('■ ').filter(Boolean).map(p=>'<p>'+esc(p.replace(/\n/g,' ').trim())+'</p>').join('')+'</div>'+group('משפטים חיוביים ללידה',text(content.affirmationIntro));
else if(route==='/practice')h=back()+heading('תרגול והכנה')+group('הצעות לתרגול יומי',text(content.daily.replace(/^הצעות לתרגול יומי\n/,'')))+group('תרגילי חיזוק והרפיה לרצפת האגן',text(content.pelvic.replace(/^תרגילי חיזוק והרפיה לרצפת האגן\n/,'')));
else if(route==='/birth')h=back()+heading('במהלך הלידה')+group("השימוש בהיפנובירת'ינג במהלך הלידה",text(content.birth.replace(/^השימוש בהיפנובירת'ינג במהלך הלידה\n/,'')));
if(!h)h=heading('לידה בנחת')+menu(groups);app.innerHTML=h;window.scrollTo(0,0);}
window.addEventListener('hashchange',render);render();
</script></body></html>
